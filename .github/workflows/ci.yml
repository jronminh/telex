name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and unit tests
        run: make check
      - name: phonotactic stress test
        run: make stress
      - name: input-method example
        run: |
          make im-loop
          printf 'tieengs vieetj\n' | ./examples/im-loop | grep -qx 'tiếng việt' 
